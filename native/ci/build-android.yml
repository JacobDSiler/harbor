name: Build Android

on:
  push:
    branches: [main, master]
    paths: ['index.html', 'apps.js', 'manifest.json', 'icon*.png', 'icon.svg', 'native/**', '.github/workflows/build-android.yml']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    # `secrets` can't be used in step-level `if:`, so expose "is it set?" as a job-level flag.
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install & build web assets
        working-directory: native
        run: |
          npm ci
          npm run build:www
          npx cap sync android

      - name: Make gradlew executable (files committed from Windows lose the flag)
        run: chmod +x native/android/gradlew

      - name: Decode release keystore (optional)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > native/android/app/release.keystore

      - name: Build debug APK (installable on any phone)
        working-directory: native/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build signed release APK + AAB (Google Play)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: native/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Rename outputs
        run: |
          mkdir -p out
          cp native/android/app/build/outputs/apk/debug/app-debug.apk out/Harbor-debug.apk
          [ -f native/android/app/build/outputs/apk/release/app-release.apk ] && cp native/android/app/build/outputs/apk/release/app-release.apk out/Harbor-release.apk || true
          [ -f native/android/app/build/outputs/bundle/release/app-release.aab ] && cp native/android/app/build/outputs/bundle/release/app-release.aab out/Harbor-release.aab || true
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Harbor-android
          path: out/*
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
