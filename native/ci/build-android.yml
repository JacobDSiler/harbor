name: Build Android

on:
  push:
    branches: [main, master]
    paths: ['index.html', 'apps.js', 'manifest.json', 'icon*.png', 'icon.svg', 'native/**', '.github/workflows/build-android.yml']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    # `secrets` can't be used in step-level `if:`, so expose "is it set?" as a job-level flag.
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' && secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The runner already ships an Android SDK. packages: '' skips the action's default install of the retired
      # 'tools' package (which made sdkmanager fail); it still accepts licences so Gradle can fetch what it needs.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install & build web assets
        working-directory: native
        run: |
          npm ci
          npm run build:www
          npx cap sync android

      - name: Make gradlew executable (files committed from Windows lose the flag)
        run: chmod +x native/android/gradlew

      - name: Decode release keystore (optional)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > native/android/app/release.keystore

      - name: Build debug APK (installable on any phone)
        working-directory: native/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build signed release APK + AAB (Google Play)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: native/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Rename outputs
        run: |
          mkdir -p out
          cp native/android/app/build/outputs/apk/debug/app-debug.apk out/Harbor-debug.apk
          [ -f native/android/app/build/outputs/apk/release/app-release.apk ] && cp native/android/app/build/outputs/apk/release/app-release.apk out/Harbor-release.apk || true
          [ -f native/android/app/build/outputs/bundle/release/app-release.aab ] && cp native/android/app/build/outputs/bundle/release/app-release.aab out/Harbor-release.aab || true
          # Stable download name: the signed release build when keystore secrets exist, otherwise the debug build.
          if [ -f out/Harbor-release.apk ]; then cp out/Harbor-release.apk out/Harbor.apk; else cp out/Harbor-debug.apk out/Harbor.apk; fi
          ls -la out

      # Optional: ships the signed bundle to the Play Console internal-testing track (needs the PLAY_SERVICE_ACCOUNT_JSON secret).
      - name: Upload to Google Play (internal testing)
        if: env.HAS_PLAY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.silertech.harbor
          releaseFiles: out/Harbor-release.aab
          track: internal
          status: draft

      - uses: actions/upload-artifact@v4
        with:
          name: Harbor-android
          path: out/*
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

      # Rolling release behind the download button on harbor.jacobsiler.com:
      # https://github.com/JacobDSiler/harbor/releases/download/android-latest/Harbor.apk
      - name: Publish rolling Android release
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Harbor for Android (latest)
          body: Latest Harbor Android build, updated automatically on every push. Download Harbor.apk and open it on your phone (allow installs from your browser or Files app when asked).
          files: out/Harbor.apk
          prerelease: false
          make_latest: false
