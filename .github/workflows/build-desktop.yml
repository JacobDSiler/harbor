name: Build Desktop

on:
  push:
    branches: [main, master]
    paths: ['electron/**', '.github/workflows/build-desktop.yml']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install
        run: npm ci

      - name: Build installer + portable exe
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned build; Windows SmartScreen will warn once

      - name: List outputs
        shell: bash
        run: ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Harbor-desktop-windows
          path: |
            electron/dist/*.exe
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: electron/dist/*.exe
